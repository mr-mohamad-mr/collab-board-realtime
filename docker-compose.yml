# Collab Board — local run (stage 4).
# One service: the FastAPI app (in-memory rooms + SQLite, so a single
# replica). Board data persists in the named volume `collab-data`.
#
#   docker compose up --build
#   # open http://localhost:8000  (or $COLLAB_PORT)
#   docker compose exec api python scripts/seed_demo.py
#   docker compose down        # keeps data; `down -v` wipes it
#
# Set COLLAB_SECRET in a local .env (same file docker compose reads)
# for anything beyond a demo — the default JWT secret is dev-only.

services:
  api:
    build: .
    image: collab-board:latest
    ports:
      - "${COLLAB_PORT:-8000}:8000"
    environment:
      - COLLAB_DB_PATH=/data/collab.db
      - COLLAB_SECRET=${COLLAB_SECRET:-dev-only-change-me}
    volumes:
      - collab-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  collab-data:
